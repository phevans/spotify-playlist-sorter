<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Playlist Sorter</title>
    <meta name="description" content="Drag-and-drop reordering for Spotify playlists, with harmonic key data for DJ mixing." />
  </head>
  <body>
    <!--
      Pre-render shell. createRoot() clears this container on mount, so users see
      it only for a moment — but it is the entire page as far as anything that
      fetches the HTML without running JavaScript is concerned, including the
      GetSongBPM crawler that verifies the attribution backlink at registration.
      The same link is rendered in the live UI (LoginPage, and the playlist
      footer in PlaylistDetail), so this mirrors what users actually see rather
      than being crawler-only content. Keep the two in sync.
    -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#121212;color:#fff;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <h1 style="font-size:28px;font-weight:700;">Playlist Sorter</h1>
        <p style="color:#b3b3b3;max-width:420px;line-height:1.5;">
          Drag and drop your Spotify playlists into any order and preview tracks instantly.
        </p>
        <p style="color:#b3b3b3;font-size:12px;">
          Key data provided by <a href="https://getsongbpm.com" style="color:#b3b3b3;">GetSongBPM.com</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
